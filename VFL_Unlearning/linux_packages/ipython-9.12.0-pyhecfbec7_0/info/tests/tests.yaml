- python:
    imports:
    - IPython
    python_version:
    - 3.12.*
    - 3.14.*
- script:
    content: |-
      ipython --version
      ipython3 --version
      ipython --help
      pygmentize -L | python -c "import sys; p = sys.stdin.read(); assert all(m in p for m in 'ipython ipython3 ipythonconsole ipython3console'.split())"
  requirements:
    run:
    - python 3.12.*
- script:
    content: |-
      mypy -p IPython
      python run_test.py
    cwd: etc/conda/test-files/ipython/2
  requirements:
    run:
    - python 3.12.*
    - mypy
    - types-decorator
    - coverage
    - argcomplete >=3.0
    - black
    - curio
    - ipykernel >6.30
    - matplotlib-base >=3.9
    - nbformat
    - numpy >=2.0
    - packaging >=23.0.0
    - pandas >=2.1
    - pytest >=7.0.0
    - pytest-asyncio >=1.0.0
    - setuptools >=80.0
    - testpath >=0.2
    - trio >=0.22.0
  files:
    source:
    - tests/
    - pyproject.toml
    recipe:
    - run_test.py
