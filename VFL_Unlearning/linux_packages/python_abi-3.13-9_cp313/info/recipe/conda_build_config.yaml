CI: github_actions
c_compiler: gcc
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: gxx
docker_image: quay.io/condaforge/linux-anvil-x86_64:alma10
extend_keys:
- pin_run_as_build
- ignore_build_only_deps
- extend_keys
- ignore_version
fortran_compiler: gfortran
ignore_build_only_deps:
- numpy
- python
is_python_min: 'false'
lua: '5'
numpy: '2'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
python: '3.8'
python_abi_tag: cp313
python_impl: '*'
python_impl_version: '3.13'
python_implementation: cpython
python_min: '3.11'
python_version: '3.13'
r_base: '3.5'
target_platform: linux-64
zip_keys:
- - python_abi_tag
  - python_version
  - python_impl_version
  - python_implementation
