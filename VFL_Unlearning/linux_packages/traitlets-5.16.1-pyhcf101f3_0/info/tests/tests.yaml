- python:
    imports:
    - traitlets
    - traitlets.config
    python_version:
    - 3.10.*
    - 3.14.*
- script:
    content:
    - coverage run --source=traitlets --parallel --branch -m pytest -vv
    - coverage run --source=traitlets --parallel --branch -m pytest -vv --pyargs traitlets
    - coverage combine
    - coverage report --show-missing --skip-covered --fail-under=80
    cwd: etc/conda/test-files/traitlets/1
  requirements:
    run:
    - argcomplete >=3.5.2
    - coverage
    - mypy >=2.0
    - pip
    - pytest >=7.0,<10
    - pytest-mock
    - pytest-mypy-testing
    - python 3.10.*
  files:
    source:
    - tests/
    - pyproject.toml
- downstream: ipython
- downstream: jupyter_server
