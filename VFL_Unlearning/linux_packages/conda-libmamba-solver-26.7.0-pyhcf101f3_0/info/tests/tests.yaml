- python:
    imports:
    - conda_libmamba_solver
    pip_check: false
    python_version: 3.10.*
- script:
  - conda create -c conda-forge -n test --dry-run scipy --solver=libmamba
  - CONDA_SOLVER=libmamba conda create -c conda-forge -n test --dry-run scipy
  requirements:
    run:
    - python 3.10.*
    - conda
