    - jupyter kernelspec list
    - python run_test.py
    requirements:
      run:
      - flaky
      - ipyparallel
      - matplotlib-base
      - numpy
      - pytest >=7.0,<10
      - pytest-asyncio >=0.23.5
      - pytest-cov
      - pytest-timeout
      - python 3.10.*
      - curio
    files:
      source:
      - tests/
      recipe:
      - run_test.py
  about:
    homepage: https://pypi.org/project/ipykernel
    repository: https://github.com/ipython/ipykernel
    documentation: https://ipykernel.readthedocs.io/
    license: BSD-3-Clause
    license_file:
    - LICENSE
    summary: IPython Kernel for Jupyter
    description: |-
      A powerful interactive Python shell and a Jupyter kernel to work with
      Python code in Jupyter notebooks and other interactive frontends.
