- python:
    imports:
    - typer
    python_version:
    - 3.10.*
    - 3.14.*
- script:
    content:
    - typer --version
    - typer --help
    - python -c "import os; os.unlink('tests/test_prepare_release.py')"
    - coverage run --source=typer --branch -m pytest -vv --color=yes --tb=long -k "not ( (multiple_values and main) or completion or invalid_score or path_convert_failures or (types_file and file_error) )"
    - coverage report --show-missing --skip-covered --fail-under=66
    cwd: etc/conda/test-files/typer/1
  requirements:
    run:
    - coverage >=7.13
    - pytest >=9
    - python 3.10.*
  files:
    source:
    - tests/
    - docs_src/
