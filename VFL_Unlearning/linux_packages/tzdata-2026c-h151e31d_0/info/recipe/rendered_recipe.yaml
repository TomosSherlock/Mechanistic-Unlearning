recipe:
  schema_version: 1
  context:
    version: 2026c
  package:
    name: tzdata
    version: 2026c
  source:
  - url: https://data.iana.org/time-zones/releases/tzdata2026c.tar.gz
    sha256: e4a178a4477f3d0ea77cc31828ff72aa38feff8d61aa13e7e99e142e9d902be4
  - url: https://data.iana.org/time-zones/releases/tzcode2026c.tar.gz
    sha256: b1cffc3ace4c4c7cd0efba2f7add86ec3d0b79da48bcf03582671fd3c8feace8
    target_directory: tzcode
  build:
    number: 0
    string: h151e31d_0
    script:
      interpreter: bash
      env:
        target_platform: osx-arm64
      file: build.sh
    noarch: generic
  requirements:
    build:
    - macosx_deployment_target_osx-arm64 11.0.*
    - clang_osx-arm64 19.*
    - make
    ignore_run_exports:
      from_package:
      - macosx_deployment_target_osx-arm64
      - clang_osx-arm64
  tests:
  - package_contents:
      files:
      - share/zoneinfo/**
      strict: true
  - script: |
      heads="$(
        find "${PREFIX}/share/zoneinfo" -type f \
          \! -name \*.zi \! -name \*.tab \! -name leapseconds \! -name leap-seconds.list \
          -exec sh -c 'head -c4 $1 && echo' sh {} \; \
          | uniq
      )"
      test "${heads}" = TZif
  about:
    homepage: https://www.iana.org/time-zones
    repository: https://github.com/eggert/tz
    documentation: https://data.iana.org/time-zones/tz-link.html
    license: LicenseRef-Public-Domain
    license_file:
    - LICENSE
    summary: The Time Zone Database (called tz, tzdb or zoneinfo) data
    description: "The Time Zone Database (called tz, tzdb or zoneinfo) contains code \n(the tzcode package) and data (this package) that represent the\nhistory of local time for many representative\nlocations around the globe.  It is updated periodically to reflect\nchanges made by political bodies to time zone boundaries, UTC offsets,\nand daylight-saving rules."
  extra:
    recipe-maintainers:
    - ocefpaf
    - mbargull
    - pganssle
    - h-vetinari
